<template>
    <lightning-card title="Expense Chart" icon-name="custom:custom19">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </template>
        
        <div class="slds-grid slds-grid_vertical">
            <div class="sum slds-p-around_small slds-col" lwc:dom = 'manual'></div>
            <div class="chart slds-var-p-around_medium slds-col" lwc:dom = 'manual'></div>
        </div>
        <template lwc:if={error}>
            <c-error-panel errors={error}></c-error-panel>
        </template>
    </lightning-card>
</template>
