<template>
    <lightning-record-edit-form object-api-name={objectApiName}> 
        <lightning-input-field field-name={date} value={date} onchange={handleChange}> </lightning-input-field>
        <lightning-input-field field-name={amount} onchange={handleChange}> </lightning-input-field>
        <lightning-input-field field-name={type} value={type} onchange={handleChange}></lightning-input-field>
        <lightning-input-field field-name={description} value={description} onchange={handleChange}>
        </lightning-input-field>
        <div class="slds-var-m-top_medium">
            <lightning-button variant="brand" type="submit" label="Save" onclick={handleSubmit}>
            </lightning-button>
        </div>
    </lightning-record-edit-form>
</template>
